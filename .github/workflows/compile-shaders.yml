name: Compile Shaders

on:
  push:
    paths:
      - 'AethonMod/Content/Effects/Shaders/*.fx'
      - '.github/workflows/compile-shaders.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MGCB
        run: dotnet tool install dotnet-mgcb --global --version 3.8.5.1

      - name: Compile shaders
        shell: pwsh
        run: |
          $shaderDir = "AethonMod/Content/Effects/Shaders"
          Get-ChildItem -Path $shaderDir -Filter *.fx | ForEach-Object {
            $name = $_.BaseName
            $fxPath = $_.FullName
            $xnbPath = Join-Path $shaderDir "$name.xnb"
            Write-Host "Compiling $name.fx -> $name.xnb"
            mgcb /build:$fxPath /outputDir:$shaderDir /platform:Windows /profile:HiDef
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Commit compiled .xnb files
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AethonMod/Content/Effects/Shaders/*.xnb
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "ci: compile shaders .fx to .xnb [skip ci]"
            git push
          }
